# Cluster policies and instance pools require the direct deployment engine.
bundle:
  name: cluster_policies_and_pools
  engine: direct
  databricks_cli_version: ">= 1.20.0"

include:
  - resources/*.yml

variables:
  # Azure: Standard_DS3_v2. AWS: i3.xlarge. GCP: n1-standard-4.
  node_type_id:
    description: Cloud node type for the policy and the instance pool
    default: Standard_DS3_v2

targets:
  # No mode: development: that mode tags jobs and pools with the same `dev` key,
  # and job clusters that use a pool reject overlapping tag keys.
  dev:
    default: true
    workspace:
      root_path: /Workspace/bundle-examples/${bundle.name}/${bundle.target}/${workspace.current_user.short_name}

  prod:
    workspace:
      root_path: /Workspace/bundle-examples/${bundle.name}/${bundle.target}
